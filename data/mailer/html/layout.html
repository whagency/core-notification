{{ define "layout" }}
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
    <title>{{ .AppName }}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta name="color-scheme" content="light">
    <meta name="supported-color-schemes" content="light">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #FFFFFF;
        }
        .row-mobile{
            display: none;
        }
        @media (max-width: 600px) {
            .wrapper {
                width: 100% !important;
                padding: 25px !important;
            }
            .stack-column td {
                display: block !important;
                width: 100% !important;
                max-width: 100% !important;
            }
            .row-mobile{
                display: table-row !important;
            }
            .row-desktop{
                display: none !important;
            }
        }
    </style>
</head>
<body style="margin:0; padding:0; background-color:#FFFFFF;">
    <table width="100%" cellpadding="0" cellspacing="0" border="0">
        <tr>
            <td align="center">
                <table class="wrapper" width="600" cellpadding="0" cellspacing="0" border="0" style="background: url('{{ .AppUrl }}/email/bg-app.png'); background-repeat: no-repeat; padding: 30px 40px 36px 40px; overflow:hidden; font-family: Evolventa, sans-serif; background-color: #fff;">
                    <tr>
                        <td>
                            <table width="100%">
                                <tr class="row-mobile stack-column">
                                    <td style="padding-bottom: 20px;" align="center">
                                        <img src="{{ .AppUrl }}/email/logo.png" alt="logo">
                                    </td>
                                    <td style="color:#000000;font-size: 16px;font-weight:bold;">
                                        {{ template "title" . }}
                                    </td>
                                </tr>
                                <tr class="row-desktop stack-column">
                                    <td style="color:#000000;font-size: 16px;font-weight:bold;padding-right: 10px;">
                                        {{ template "title" . }}
                                    </td>
                                    <td>
                                        <img src="{{ .AppUrl }}/email/logo.png" width="96" alt="logo">
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>

                    {{ template "content" . }}

                    <tr>
                        <td>
                            <p style="font-size: 12px; color: #10101080;margin: 0;">© {{ .Year }} {{ .AppName }}. {{ t "layout.copy" . }}</p>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
{{ end }}
