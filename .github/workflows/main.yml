name: Deploy notification service

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build image
        env:
          PRIVATE_REPO_GITHUB_TOKEN: ${{ secrets.PRIVATE_REPO_GITHUB_TOKEN }}
        run: |
          docker build \
            --secret id=github_token,env=PRIVATE_REPO_GITHUB_TOKEN \
            -t fin-notification:latest \
            -f ./docker/production/Dockerfile \
            .
          docker save fin-notification:latest -o ./fin-notification.tar
          chmod 644 ./fin-*.tar

      - name: Copy image to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ vars.SERVER_HOST }}
          username: ${{ vars.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_PRIVATE_KEY }}
          source: "fin-*.tar"
          target: "/var/www/deploy/"

      - name: Deploy on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ vars.SERVER_HOST }}
          username: ${{ vars.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_PRIVATE_KEY }}
          script: |
            docker network create \
              --driver bridge \
              --subnet=172.28.0.0/16 \
              --ip-range=172.28.0.128/25 \
              fin_network || true
            
            docker load -i /var/www/deploy/fin-notification.tar
            docker stop fin_notification || true
            docker rm fin_notification || true

            cat > /var/www/deploy/notification.env <<EOF
            DB_HOST=${{ vars.DB_HOST }}
            DB_PORT=${{ vars.DB_PORT }}
            DB_NAME=${{ vars.DB_NAME }}
            DB_USER=${{ vars.DB_USER }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            SECURITY_TOKEN=${{ secrets.SECURITY_TOKEN }}
            WS_SECURITY_TOKEN=${{ secrets.WS_SECURITY_TOKEN }}
            APP_NAME=${{ vars.APP_NAME }}
            APP_ENVIRONMENT=${{ vars.APP_ENVIRONMENT }}
            DEFAULT_APP_URL=${{ vars.DEFAULT_APP_URL }}
            QUEUE_HOST=${{ vars.QUEUE_HOST }}
            QUEUE_PORT=${{ vars.QUEUE_PORT }}
            QUEUE_USER=${{ vars.QUEUE_USER }}
            QUEUE_PASSWORD=${{ secrets.QUEUE_PASSWORD }}
            MAIL_MAILER=${{ vars.MAIL_MAILER }}
            MAIL_ENCRYPTION=${{ vars.MAIL_ENCRYPTION }}
            MAIL_HOST=${{ vars.MAIL_HOST }}
            MAIL_PORT=${{ vars.MAIL_PORT }}
            MAIL_USERNAME=${{ vars.MAIL_USERNAME }}
            MAIL_PASSWORD=${{ secrets.MAIL_PASSWORD }}
            MAIL_FROM_ADDRESS=${{ vars.MAIL_FROM_ADDRESS }}
            MAIL_FROM_NAME=${{ vars.MAIL_FROM_NAME }}
            MAIL_ADMIN=${{ vars.MAIL_ADMIN }}
            LOG_LEVEL=${{ vars.LOG_LEVEL }}
            LOG_STDOUT_FORMAT=${{ vars.LOG_STDOUT_FORMAT }}
            LOG_HTTP_NOT_LOGGABLE_PATHS=${{ vars.LOG_HTTP_NOT_LOGGABLE_PATHS }}
            USER_SERVICE_GRPC_URL=${{ vars.USER_SERVICE_GRPC_URL }}
            USER_SERVICE_URL=${{ vars.USER_SERVICE_URL }}
            TRACER_ENABLE=${{ vars.TRACER_ENABLE }}
            TRACER_PROTOCOL=${{ vars.TRACER_PROTOCOL }}
            TRACER_ENDPOINT=${{ vars.TRACER_ENDPOINT }}
            TRACER_SAMPLE_RATIO=${{ vars.TRACER_SAMPLE_RATIO }}
            TRACER_HTTP_NOT_TRACEABLE_PATHS=${{ vars.TRACER_HTTP_NOT_TRACEABLE_PATHS }}
            DB_LOG_TRACE_STATEMENT_ALWAYS=${{ vars.DB_LOG_TRACE_STATEMENT_ALWAYS }}
            EOF

            docker run --rm \
              --network fin_network \
              --env-file /var/www/deploy/notification.env \
              fin-notification:latest \
              migrate --command=up

            docker run -d \
              --name fin_notification \
              --restart always \
              -p "127.0.0.1:${{ vars.WS_GATE_PORT }}:8100" \
              --env-file /var/www/deploy/notification.env \
              --log-driver gelf \
              --log-opt gelf-address=udp://${{ vars.LOG_LOGSTASH_GELF_HOST }} \
              --log-opt tag=${{ vars.APP_NAME }} \
              --network fin_network \
              fin-notification:latest
            rm /var/www/deploy/fin-notification.tar
            rm /var/www/deploy/notification.env
